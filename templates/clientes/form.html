{% extends "base.html" %}

{% block title %}POWER LED | {% if cliente %}Editar Cliente{% else %}Nuevo Cliente{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="{{ url_for('clientes_bp.index') }}" class="btn btn-outline-secondary rounded-circle"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="fw-bold text-white mb-0" style="font-family: var(--font-heading);">
                {% if cliente %}Editar Cliente: {{ cliente.nombre }}{% else %}Registrar Cliente Automotriz / Aliado{% endif %}
            </h2>
        </div>

        <div class="card card-custom p-4 p-md-5">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-bold text-white">Nombre Completo o Razón Social *</label>
                        <input type="text" name="nombre" class="form-control" required value="{{ cliente.nombre if cliente else '' }}" placeholder="Ej: AutoLujos El Norte / Carlos Pérez">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-white">Cédula / NIT</label>
                        <input type="text" name="documento" class="form-control" value="{{ cliente.documento if cliente and cliente.documento else '' }}" placeholder="Ej: 1098765432">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-white">Teléfono / WhatsApp</label>
                        <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono if cliente and cliente.telefono else '' }}" placeholder="Ej: 3001234567">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-white">Placa Frecuente</label>
                        <input type="text" name="placa_frecuente" class="form-control text-uppercase fw-bold" maxlength="10" value="{{ cliente.placa_frecuente if cliente and cliente.placa_frecuente else '' }}" placeholder="Ej: ABC123">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-white">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control" value="{{ cliente.email if cliente and cliente.email else '' }}">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold text-white">Dirección / Ubicación</label>
                        <input type="text" name="direccion" class="form-control" value="{{ cliente.direccion if cliente and cliente.direccion else '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #029CC2;">Lista de Precios por Defecto</label>
                        <select name="lista_precio_default" class="form-select">
                            <option value="cliente_final" {% if not cliente or cliente.lista_precio_default == 'cliente_final' %}selected{% endif %}>3. Cliente Final (Público)</option>
                            <option value="local" {% if cliente and cliente.lista_precio_default == 'local' %}selected{% endif %}>2. Local (Comerciante)</option>
                            <option value="distribuidor" {% if cliente and cliente.lista_precio_default == 'distribuidor' %}selected{% endif %}>1. Distribuidor (Mayorista / Taller Aliado)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #40A435;">Cupo Límite de Crédito (COP)</label>
                        <input type="number" step="1000" name="limite_credito" class="form-control fw-bold" value="{{ '%.0f'|format((cliente.limite_credito or 0)|float) if cliente else '0' }}">
                    </div>
                </div>
                <hr class="my-4" style="border-color: #21262d;">
                <div class="text-end">
                    <a href="{{ url_for('clientes_bp.index') }}" class="btn btn-outline-secondary rounded-pill px-4 me-2">Cancelar</a>
                    <button type="submit" class="btn btn-blue rounded-pill px-5 fw-bold">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
